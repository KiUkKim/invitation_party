<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9a9e"/>
      <stop offset="50%" stop-color="#fad0c4"/>
      <stop offset="100%" stop-color="#fbc2eb"/>
